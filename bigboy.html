<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="profile-card">
    <div class="card-header">
      <img class="profile-img" src="https://picsum.photos" alt="Profile Picture">
    </div>
    <div class="card-body">
      <h2 class="name">Alex Rivers</h2>
      <p class="title">Front-End Developer</p>
      <p class="bio">Passionate about creating clean, accessible, and highly responsive user interfaces. Coding by day, gaming by night.</p>
      <div class="stats">
        <div class="stat-box">
          <span class="stat-number">42</span>
          <span class="stat-label">Projects</span>
        </div>
        <div class="stat-box">
          <span class="stat-number">12k</span>
          <span class="stat-label">Followers</span>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary">Follow</button>
      <button class="btn btn-secondary">Message</button>
    </div>
  </div>

<style>
  /* Reset and Base Styles */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* Card Container */
.profile-card {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
  width: 100%;
  max-width: 350px;
  overflow: hidden;
  text-align: center;
  transition: transform 0.3s ease;
}

.profile-card:hover {
  transform: translateY(-5px);
}

/* Header & Image */
.card-header {
  background: #764ba2;
  height: 120px;
  position: relative;
}

.profile-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 5px solid #ffffff;
  position: absolute;
  bottom: -55px;
  left: 50%;
  transform: translateX(-50%);
  object-fit: cover;
  background-color: #eee;
}

/* Card Body */
.card-body {
  padding: 70px 24px 20px 24px;
}

.name {
  font-size: 24px;
  color: #333333;
  margin-bottom: 4px;
}

.title {
  font-size: 14px;
  color: #764ba2;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 15px;
}

.bio {
  font-size: 14px;
  color: #666666;
  line-height: 1.5;
  margin-bottom: 25px;
}

/* Stats Section */
.stats {
  display: flex;
  justify-content: space-around;
  border-top: 1px solid #eeeeee;
  padding-top: 20px;
}

.stat-box {
  display: flex;
  flex-direction: column;
}

.stat-number {
  font-size: 18px;
  font-weight: bold;
  color: #333333;
}

.stat-label {
  font-size: 12px;
  color: #999999;
  text-transform: uppercase;
  margin-top: 2px;
}

/* Footer & Buttons */
.card-footer {
  padding: 0 24px 30px 24px;
  display: flex;
  gap: 12px;
}

.btn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s ease;
}

.btn:hover {
  opacity: 0.9;
}

.btn-primary {
  background: #764ba2;
  color: #ffffff;
}

.btn-secondary {
  background: #f0f0f0;
  color: #333333;
}
</style>
</body>
</html>
